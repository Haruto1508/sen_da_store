# ==============================================================================
# SEN XINH GARDEN - APPLICATION CONFIGURATION
# Tự động nạp cấu hình từ file .env nếu có, kèm giá trị mặc định an toàn
# ==============================================================================

# Tự động nạp file .env ở thư mục gốc backend (nếu có)
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8080}
spring.application.name=succulentshop-backend

# Database (PostgreSQL Local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/succulentshop}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

