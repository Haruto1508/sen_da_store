momo.access-key=${MOMO_ACCESS_KEY:klm05TvNBzhg7hZ8}
momo.secret-key=${MOMO_SECRET_KEY:at67qH6mk8w5Y1nAyMoYKMWACiEi2Aca}
momo.api-url=${MOMO_API_URL:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/#order-success}
