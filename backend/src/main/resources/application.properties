# ==============================================================================
# SEN XINH GARDEN - APPLICATION CONFIGURATION
# Tự động nạp cấu hình từ file .env ở thư mục gốc hoặc thư mục backend
# ==============================================================================

# Tự động nạp file .env
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Server
server.port=${SERVER_PORT}
spring.application.name=succulentshop-backend

# Database (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=${JPA_DIALECT}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.open-in-view=true

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE}
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# Google OAuth2 Configuration
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Cloudinary Cloud Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# SePay / Bank Transfer Webhook Configuration
sepay.api-key=${SEPAY_API_KEY}
bank.code=${BANK_CODE}
bank.account-number=${BANK_ACCOUNT_NUMBER}
bank.account-name=${BANK_ACCOUNT_NAME}

# Order Auto-Cancel Configuration
# Tự động hủy đơn PENDING (chuyển khoản) chưa thanh toán sau N phút
order.pending.timeout-minutes=${ORDER_PENDING_TIMEOUT_MINUTES:30}

# JavaMailSender Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Order Return Policy Configuration
# Thời hạn tối đa cho phép khách hàng yêu cầu hoàn trả đơn hàng (tính theo ngày)
order.return.window-days=${ORDER_RETURN_WINDOW_DAYS:7}

# Redis & Spring Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.cache.type=${SPRING_CACHE_TYPE:redis}

